<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#f9f5eb;background:radial-gradient(circle at 50% 8%,#252b58 0,#0b0e20 34%,#03040a 78%);font-family:Georgia,"Songti SC",serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.3px),radial-gradient(circle,#ffe9a8 0 1px,transparent 1.4px);background-size:67px 67px,119px 119px;background-position:11px 19px,51px 73px}.wrap{position:relative;width:min(930px,89vw);text-align:center}.line{margin:0;font-size:clamp(2rem,5.7vw,4.6rem);line-height:1.46;font-weight:600;text-wrap:balance;text-shadow:0 2px 22px #000}.initial{border:0;padding:0 .01em;background:none;color:#ffe9a8;font:inherit;font-weight:700;cursor:pointer;text-shadow:0 0 10px #ffc75f,0 0 24px #ffc75f66}.cn{margin:2rem 0 0;color:#ffffffb5;font-size:clamp(1rem,2.3vw,1.4rem);line-height:1.8;letter-spacing:.06em}dialog{width:min(430px,86vw);border:1px solid #ffe9a82d;border-radius:25px;padding:0;background:#11152eea;color:#fff;box-shadow:0 22px 80px #000b;backdrop-filter:blur(16px)}dialog::backdrop{background:#02040ab8;backdrop-filter:blur(3px)}.card{padding:32px 25px;text-align:center}.star{color:#ffe9a8;font-size:30px;text-shadow:0 0 18px #ffc75f;margin-bottom:14px}.gift{margin:0 0 12px;font-size:clamp(1.4rem,4vw,1.95rem);font-weight:650}.hint{margin:0 0 22px;color:#ffffff91;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.65}.close{border:1px solid #ffe9a833;border-radius:99px;padding:10px 20px;background:#ffffff12;color:#fff;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
</style></head><body><main class="wrap"><p class="line"><button class="initial" data-gift="0">M</button>oonlight <button class="initial" data-gift="1">P</button>aints <button class="initial" data-gift="2">O</button>ur <button class="initial" data-gift="3">P</button>romises;<br><button class="initial" data-gift="4">S</button>tars <button class="initial" data-gift="5">B</button>ecome <button class="initial" data-gift="6">C</button>onstellations,<br><button class="initial" data-gift="7">S</button>pelling <button class="initial" data-gift="8">N</button>ames.</p><p class="cn">“月色落笔，写下诺言；群星成座，拼成你我的名字。”</p></main><dialog id="d"><div class="card"><div class="star">✦</div><p class="gift" id="g"></p><p class="hint" id="h"></p><button class="close" id="x">收好这颗星</button></div></dialog><script>
const gifts=["手办 · maiya","笔 · pen","许愿柳 · one wish willow","除螨喷雾 · pentac","袜子 · socks","榨汁机 · Blender","巧克力 · chocolate","项链 · Silver necklace","小夜灯 · nightlight"],messages=["our 3D trip memory，powered by maiya3d，colored and repaired by LSY","让星星人陪你一起写下开心与幸福🥰","许愿之后折断，寿星梦想成真","赶走臭臭的螨虫也赶走生活中烦烦的苦恼🌟","亲测健身工作日常都适合，千里之行始于足下","果子变成果汁，水果交出甜，我交出我的心","今年的日子像雪吻巧克力丝滑顺利","前途像钻石一样闪耀🪩","北极星照亮我，小夜灯照亮北极星✨"],d=document.querySelector("#d"),g=document.querySelector("#g"),h=document.querySelector("#h");document.querySelectorAll(".initial").forEach(b=>b.onclick=()=>{let i=+b.dataset.gift;g.textContent=gifts[i];h.textContent=messages[i];d.showModal()});document.querySelector("#x").onclick=()=>d.close();d.onclick=e=>{let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()};
</script></body></html>
