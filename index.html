<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030611"><title>LCQ2026</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030611}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#f8f5ee;font-family:Georgia,"Songti SC",serif;background:radial-gradient(ellipse at 50% 18%,#18234c 0,#0a1027 30%,#040713 62%,#010208 100%)}.nebula{position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at 22% 32%,#6173c718 0,transparent 32%),radial-gradient(ellipse at 76% 60%,#816da414 0,transparent 28%),radial-gradient(circle at 50% 48%,#d8c9920b 0,transparent 25%);filter:blur(24px);animation:drift 18s ease-in-out infinite alternate}.stars,.stars:before,.stars:after{position:fixed;inset:0;content:"";pointer-events:none;background-repeat:repeat}.stars{opacity:.7;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.2px);background-size:83px 83px;animation:twinkle 5s ease-in-out infinite}.stars:before{opacity:.45;background-image:radial-gradient(circle,#dce5ff 0 1.2px,transparent 1.5px);background-size:137px 137px;background-position:31px 49px;animation:twinkle 7s 1s ease-in-out infinite}.stars:after{opacity:.28;background-image:radial-gradient(circle,#ffe8aa 0 1.5px,transparent 1.8px);background-size:211px 211px;background-position:87px 123px;animation:twinkle 9s 2s ease-in-out infinite}.polar{position:fixed;top:12%;left:74%;width:5px;height:5px;border-radius:50%;background:#fff8d7;box-shadow:0 0 7px 2px #fff,0 0 24px 8px #cdd8ff88,0 0 70px 20px #7d8fff24;animation:pulse 3.6s ease-in-out infinite}.meteor{position:fixed;top:18%;left:-18%;width:90px;height:1px;opacity:0;background:linear-gradient(90deg,transparent,#fff);transform:rotate(-20deg);animation:shoot 13s 4s ease-in-out infinite}.wrap{position:relative;z-index:2;width:min(940px,89vw);text-align:center}.line{margin:0;font-size:clamp(2rem,5.7vw,4.6rem);line-height:1.48;font-weight:560;letter-spacing:.005em;text-wrap:balance;text-shadow:0 2px 25px #000,0 0 40px #7585c30d}.initial{border:0;padding:0 .01em;background:none;color:#f8e7b2;font:inherit;font-weight:700;cursor:pointer;text-shadow:0 0 8px #fff1c4aa,0 0 23px #e5bd6480;transition:.25s}.initial:hover,.initial:active{color:#fff8dc;text-shadow:0 0 8px #fff,0 0 30px #f3c968}.cn{margin:2rem 0 0;color:#ffffffa5;font-size:clamp(1rem,2.3vw,1.4rem);line-height:1.8;letter-spacing:.08em;text-shadow:0 2px 14px #000}.music{position:fixed;z-index:5;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));width:43px;height:43px;border-radius:50%;border:1px solid #ffffff24;background:#0d1327a8;color:#f8e7b2;backdrop-filter:blur(14px);font-size:18px;box-shadow:0 8px 28px #0007;cursor:pointer}.music.playing{box-shadow:0 0 22px #f4d77b45}.gate{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#19234c 0,#080d21 40%,#02030a 100%);transition:opacity 1s,visibility 1s}.gate.hide{opacity:0;visibility:hidden}.enter{border:1px solid #f8e7b250;border-radius:999px;padding:16px 27px;background:#ffffff0b;color:#fff4d0;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.13em;box-shadow:0 0 45px #e6ca7330;backdrop-filter:blur(12px);cursor:pointer}.enter .spark{display:inline-block;margin-right:9px;animation:pulse 2.2s infinite}dialog{width:min(440px,86vw);border:1px solid #f6e7bd2e;border-radius:27px;padding:0;background:linear-gradient(145deg,#171d3aeb,#0b1025e8);color:#fff;box-shadow:0 25px 90px #000c,inset 0 1px #ffffff12;backdrop-filter:blur(22px)}dialog::backdrop{background:#01030ab8;backdrop-filter:blur(5px)}.card{padding:34px 27px;text-align:center}.star{color:#f8e7b2;font-size:31px;text-shadow:0 0 20px #f2cb6d;margin-bottom:14px}.gift{margin:0 0 13px;font-size:clamp(1.4rem,4vw,1.95rem);font-weight:650}.hint{margin:0 auto 24px;max-width:350px;color:#ffffff9e;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.75}.close{border:1px solid #f8e7b23b;border-radius:99px;padding:10px 20px;background:#ffffff0c;color:#fff;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}@keyframes twinkle{50%{opacity:.35}}@keyframes pulse{50%{transform:scale(1.35);opacity:.75}}@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.04)}}@keyframes shoot{0%,72%{opacity:0;transform:translate(0,0) rotate(-20deg)}75%{opacity:.8}82%,100%{opacity:0;transform:translate(125vw,42vh) rotate(-20deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div class="nebula"></div><div class="stars"></div><div class="polar"></div><div class="meteor"></div><div class="gate" id="gate"><button class="enter" id="enter"><span class="spark">✦</span>点亮北极星</button></div><button class="music" id="music" aria-label="播放或暂停背景音乐">♪</button><audio id="bgm" src="never-goodbye.mp3" loop preload="auto"></audio><main class="wrap"><p class="line"><button class="initial" data-gift="0">M</button>oonlight <button class="initial" data-gift="1">P</button>aints <button class="initial" data-gift="2">O</button>ur <button class="initial" data-gift="3">P</button>romises;<br><button class="initial" data-gift="4">S</button>tars <button class="initial" data-gift="5">B</button>ecome <button class="initial" data-gift="6">C</button>onstellations,<br><button class="initial" data-gift="7">S</button>pelling <button class="initial" data-gift="8">N</button>ames.</p><p class="cn">“月色落笔，写下诺言；群星成座，拼成你我的名字。”</p></main><dialog id="d"><div class="card"><div class="star">✦</div><p class="gift" id="g"></p><p class="hint" id="h"></p><button class="close" id="x">收好这颗星</button></div></dialog><script>
const gifts=["手办 · maiya","笔 · pen","许愿柳 · one wish willow","除螨喷雾 · pentac","袜子 · socks","榨汁机 · Blender","巧克力 · chocolate","项链 · Silver necklace","小夜灯 · nightlight"],messages=["our 3D trip memory，powered by maiya3d，colored and repaired by LSY","让星星人陪你一起写下开心与幸福🥰","许愿之后折断，寿星梦想成真","赶走臭臭的螨虫也赶走生活中烦烦的苦恼🌟","亲测健身工作日常都适合，千里之行始于足下","果子变成果汁，水果交出甜，我交出我的心","今年的日子像雪吻巧克力丝滑顺利","前途像钻石一样闪耀🪩","北极星照亮我，小夜灯照亮北极星✨"];const d=document.querySelector("#d"),g=document.querySelector("#g"),h=document.querySelector("#h"),bgm=document.querySelector("#bgm"),music=document.querySelector("#music"),gate=document.querySelector("#gate");document.querySelectorAll(".initial").forEach(b=>b.onclick=()=>{let i=+b.dataset.gift;g.textContent=gifts[i];h.textContent=messages[i];d.showModal()});document.querySelector("#x").onclick=()=>d.close();d.onclick=e=>{let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()};function sync(){music.textContent=bgm.paused?"♪":"Ⅱ";music.classList.toggle("playing",!bgm.paused)}document.querySelector("#enter").onclick=async()=>{gate.classList.add("hide");try{await bgm.play()}catch(e){}sync()};music.onclick=async()=>{if(bgm.paused){try{await bgm.play()}catch(e){}}else bgm.pause();sync()};bgm.onplay=sync;bgm.onpause=sync;
</script></body></html>
