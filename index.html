*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02040b}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#f7f5ef;font-family:Georgia,"Songti SC",serif;background:radial-gradient(ellipse at 50% 38%,#10162b 0,#060916 42%,#02040b 76%,#010207 100%)}#sky{position:fixed;inset:-4%;width:108%;height:108%;z-index:0;transition:transform .8s ease-out;opacity:.9}.nebula{position:fixed;z-index:0;inset:-18%;pointer-events:none;background:radial-gradient(ellipse at 47% 48%,rgba(72,91,157,.13),transparent 26%),radial-gradient(ellipse at 31% 56%,rgba(95,68,130,.09),transparent 23%),radial-gradient(ellipse at 68% 38%,rgba(55,83,142,.08),transparent 21%);filter:blur(38px);animation:drift 24s ease-in-out infinite alternate}.vignette{position:fixed;z-index:1;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 55px rgba(0,0,0,.68);background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.46) 100%)}.grain{position:fixed;z-index:2;inset:-50%;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");animation:noise .25s steps(2) infinite}.polar{position:fixed;z-index:3;top:13%;left:76%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 5px 2px #fff,0 0 18px 7px #dbe5ff99,0 0 55px 17px #8da5ff38,0 0 120px 34px #6684e214}.polar:before,.polar:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,#fff9,transparent)}.polar:before{width:44px;height:1px}.polar:after{width:1px;height:44px;background:linear-gradient(transparent,#fff9,transparent)}body.lit .polar{animation:starPulse 4.2s ease-in-out infinite}.shoot{position:fixed;z-index:2;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0}.shoot:after{content:"";position:absolute;right:1px;width:100px;height:1px;background:linear-gradient(90deg,transparent,#d7e5ffb3)}.s1{top:22%;left:8%;animation:meteor 16s 7s infinite}.s2{top:46%;left:-5%;animation:meteor 21s 15s infinite}.wrap{position:relative;z-index:4;width:min(960px,89vw);text-align:center;opacity:.18;filter:blur(1.5px);transform:translateY(8px);transition:2.2s ease 1s}body.lit .wrap{opacity:1;filter:none;transform:none}.line{margin:0;font-size:clamp(2rem,5.7vw,4.6rem);line-height:1.48;font-weight:520;letter-spacing:.008em;text-wrap:balance;text-shadow:0 2px 26px #000}.initial{border:0;padding:0 .01em;background:none;color:#f6e7b6;font:inherit;font-weight:680;cursor:pointer;text-shadow:0 0 7px #fff3cf99,0 0 22px #dcbf6d66;transition:.3s}.initial.seen{color:#fff9df;text-shadow:0 0 9px #fff,0 0 28px #e6c66c}.cn{margin:2rem 0 0;color:#ffffff9c;font-size:clamp(1rem,2.3vw,1.4rem);line-height:1.8;letter-spacing:.09em}.music{position:fixed;z-index:8;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));width:43px;height:43px;border-radius:50%;border:1px solid #ffffff20;background:#0a0e1cb8;color:#f5e5b4;backdrop-filter:blur(16px);font-size:18px;box-shadow:0 8px 30px #0009;cursor:pointer}.gate{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,#0c1124,#040711 46%,#010207);transition:opacity 2s,visibility 2s}.gate.hide{opacity:0;visibility:hidden}.gatebox{text-align:center}.enter{border:1px solid #f4e4b744;border-radius:999px;padding:16px 28px;background:#ffffff08;color:#fff2cb;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.16em;backdrop-filter:blur(14px)}.audio-status{min-height:22px;margin:14px 20px 0;color:#ffffff78;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
/* liquid glass */dialog{width:min(448px,88vw);border:0;border-radius:32px;padding:1px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#ffffffad,#b1cdff38 18%,#ffffff12 43%,#8b74dc30 72%,#ffe2ae4d);box-shadow:0 36px 120px #000a,0 10px 35px #354c962e,inset 0 1px #ffffff80;backdrop-filter:blur(32px) saturate(155%);-webkit-backdrop-filter:blur(32px) saturate(155%);opacity:0;transform:scale(.92) translateY(12px);filter:blur(7px);transition:.4s ease}dialog[open]{opacity:1;transform:none;filter:none}dialog::backdrop{background:radial-gradient(circle at 50% 48%,#2c39692e,#000209ad);backdrop-filter:blur(9px)}.card{position:relative;overflow:hidden;border-radius:31px;padding:38px 29px 30px;text-align:center;background:linear-gradient(145deg,#dce8ff21,#1017314f 43%,#0509166b);box-shadow:inset 0 1px 1px #ffffff45}.star{display:inline-grid;place-items:center;width:51px;height:51px;margin:0 0 17px;border-radius:50%;color:#fff3c9;font-size:29px;background:#ffffff10;border:1px solid #ffffff29;box-shadow:inset 0 1px #ffffff4d,0 0 30px #f5d88524;text-shadow:0 0 16px #f7d98c}.gift{margin:0 0 13px;font-size:clamp(1.45rem,4vw,2rem);font-weight:650}.hint{margin:0 auto 26px;max-width:350px;color:#f6f8ffb8;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;line-height:1.78}.close,.replay{border:1px solid #ffffff40;border-radius:999px;padding:11px 22px;background:linear-gradient(135deg,#ffffff2e,#becfff12);color:#fffffff0;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;backdrop-filter:blur(14px)}
/* birthday finale */.finale{position:fixed;z-index:30;inset:0;display:grid;place-items:center;visibility:hidden;opacity:0;background:radial-gradient(circle at 50% 45%,#1b285485,rgba(2,4,12,.88) 58%,#010207f5);backdrop-filter:blur(7px);transition:opacity .8s,visibility .8s}.finale.show{visibility:visible;opacity:1}.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti i{position:absolute;top:-8vh;width:8px;height:16px;border-radius:2px;opacity:.9;animation:fall var(--dur) var(--delay) cubic-bezier(.2,.6,.4,1) forwards;transform:translate3d(0,-10vh,0) rotate(0)}.birthday{position:relative;text-align:center;width:min(650px,92vw);padding:20px;transform:scale(.88);opacity:0}.finale.show .birthday{animation:reveal 1.15s .35s cubic-bezier(.16,1,.3,1) forwards}.birthday h1{margin:0;font-size:clamp(2.25rem,8vw,5rem);line-height:1.05;font-weight:600;color:#fff7db;text-shadow:0 0 12px #fff5d2aa,0 0 45px #d7bd6c60,0 8px 40px #000}.birthday .wish{margin:18px 0 24px;color:#eef3ffd1;font:clamp(.95rem,3.2vw,1.15rem) Georgia,serif;letter-spacing:.09em}.cake{position:relative;width:190px;height:165px;margin:12px auto 25px;filter:drop-shadow(0 18px 24px #0007)}.plate{position:absolute;left:17px;bottom:3px;width:156px;height:20px;border-radius:50%;background:linear-gradient(#dbe7ff,#8295c0);box-shadow:inset 0 3px #fff9}.layer{position:absolute;left:32px;bottom:20px;width:126px;height:75px;border-radius:10px 10px 22px 22px;background:linear-gradient(110deg,#e7c4aa,#fff1df 38%,#d8a98c);box-shadow:inset 0 8px #fff6,0 8px 22px #0004}.icing{position:absolute;left:29px;bottom:83px;width:132px;height:32px;border-radius:50%;background:linear-gradient(120deg,#fff,#f2e9ff 58%,#cbd9ff);box-shadow:0 6px 12px #8d6fa32b}.drip{position:absolute;top:19px;width:15px;background:#f6edff;border-radius:0 0 12px 12px}.d1{left:20px;height:26px}.d2{left:57px;height:17px}.d3{right:23px;height:30px}.candle{position:absolute;left:89px;bottom:109px;width:12px;height:42px;border-radius:5px;background:repeating-linear-gradient(45deg,#f5d7ef 0 6px,#829de3 6px 12px);box-shadow:inset 2px 0 #fff7}.flame{position:absolute;left:89px;bottom:151px;width:13px;height:23px;border-radius:70% 30% 70% 30%;background:radial-gradient(circle at 55% 70%,#fff,#ffe785 35%,#ff9f43 70%);box-shadow:0 0 13px #ffd86e,0 0 32px #ffbd4d88;transform:rotate(45deg);animation:flame .85s ease-in-out infinite alternate}.final-star{position:absolute;top:10%;left:76%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px #fff,0 0 50px 18px #b9c9ff,0 0 130px 45px #718dff66;animation:finalStar 2s ease-out}.replay{cursor:pointer}.dismiss{display:block;margin:12px auto 0;border:0;background:none;color:#ffffff70;font:12px -apple-system,sans-serif;letter-spacing:.08em;cursor:pointer}@keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0)}100%{transform:translate3d(var(--drift),112vh,0) rotate(var(--spin))}}@keyframes reveal{to{transform:scale(1);opacity:1}}@keyframes flame{to{transform:rotate(39deg) scale(.9,1.08)}}@keyframes finalStar{0%{transform:scale(.4);opacity:.2}40%{transform:scale(2.5);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes drift{to{transform:translate3d(2.5%,-1.5%,0) scale(1.035)}}@keyframes noise{25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}}@keyframes starPulse{50%{transform:scale(1.35);opacity:.72}}@keyframes meteor{0%,76%{opacity:0;transform:translate(0) rotate(-25deg)}78%{opacity:.8}83%,100%{opacity:0;transform:translate(115vw,48vh) rotate(-25deg)}}@media(max-width:600px){.vignette{box-shadow:inset 0 0 100px 20px #0009}.polar{top:15%;left:80%}.cake{transform:scale(.9);margin-top:0;margin-bottom:10px}}@media(prefers-reduced-motion:reduce){.nebula,.grain,.polar,.shoot{animation:none!important}}
</style></head><body><canvas id="sky"></canvas><div class="nebula"></div><div class="vignette"></div><div class="grain"></div><div class="polar"></div><div class="shoot s1"></div><div class="shoot s2"></div><div class="gate" id="gate"><div class="gatebox"><button class="enter" id="enter"><span>✦</span> 点亮北极星</button><div class="audio-status" id="audioStatus"></div></div></div><button class="music" id="music">♪</button><audio id="bgm" loop preload="metadata" playsinline><source src="./never-goodbye.mp3" type="audio/mpeg"></audio><main class="wrap"><p class="line"><button class="initial" data-gift="0">M</button>oonlight <button class="initial" data-gift="1">P</button>aints <button class="initial" data-gift="2">O</button>ur <button class="initial" data-gift="3">P</button>romises;<br><button class="initial" data-gift="4">S</button>tars <button class="initial" data-gift="5">B</button>ecome <button class="initial" data-gift="6">C</button>onstellations,<br><button class="initial" data-gift="7">S</button>pelling <button class="initial" data-gift="8">N</button>ames.</p><p class="cn">“月色落笔，写下诺言；群星成座，拼成你我的名字。”</p></main><dialog id="d"><div class="card"><div class="star">✦</div><p class="gift" id="g"></p><p class="hint" id="h"></p><button class="close" id="x">收好这颗星</button></div></dialog><section class="finale" id="finale"><div class="confetti" id="confetti"></div><div class="final-star"></div><div class="birthday"><h1>Happy Birthday<br>To LCQ ✨</h1><p class="wish">May every wish find its star.</p><div class="cake"><div class="plate"></div><div class="layer"></div><div class="icing"><i class="drip d1"></i><i class="drip d2"></i><i class="drip d3"></i></div><div class="candle"></div><div class="flame"></div></div><button class="replay" id="replay">再看一次 ✦</button><button class="dismiss" id="dismiss">回到星空</button></div></section><script>
const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d');let stars=[];function makeSky(){let d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=w*d;canvas.height=h*d;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);stars=[];let n=Math.round(w*h/4800);for(let i=0;i<n;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()<.08?Math.random()*1.25+.65:Math.random()*.62+.18,a:Math.random()*.62+.18,p:Math.random()*6.28,s:Math.random()*.009+.002})}function draw(t){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){let a=s.a*(.72+.28*Math.sin(t*s.s+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fillStyle=`rgba(${s.r>1?'255,244,215':'220,230,255'},${a})`;ctx.fill()}requestAnimationFrame(draw)}makeSky();requestAnimationFrame(draw);addEventListener('resize',makeSky);
const gifts=["手办 · maiya","笔 · pen","许愿柳 · one wish willow","除螨喷雾 · pentac","袜子 · socks","榨汁机 · Blender","巧克力 · chocolate","项链 · Silver necklace","小夜灯 · nightlight"],messages=["our 3D trip memory，powered by maiya3d，colored and repaired by LSY","让星星人陪你一起写下开心与幸福🥰","许愿之后折断，寿星梦想成真","赶走臭臭的螨虫也赶走生活中烦烦的苦恼🌟","亲测健身工作日常都适合，千里之行始于足下","果子变成果汁，水果交出甜，我交出我的心","今年的日子像雪吻巧克力丝滑顺利","前途像钻石一样闪耀🪩","北极星照亮我，小夜灯照亮北极星✨"];
const d=document.querySelector('#d'),g=document.querySelector('#g'),h=document.querySelector('#h'),bgm=document.querySelector('#bgm'),music=document.querySelector('#music'),gate=document.querySelector('#gate'),enter=document.querySelector('#enter'),statusEl=document.querySelector('#audioStatus'),finale=document.querySelector('#finale'),confetti=document.querySelector('#confetti');const visited=new Set();let finaleTriggered=false;
document.querySelectorAll('.initial').forEach(b=>b.onclick=()=>{let i=+b.dataset.gift;visited.add(i);b.classList.add('seen');g.textContent=gifts[i];h.textContent=messages[i];d.showModal()});function closeGift(){d.close();if(visited.size===9&&!finaleTriggered){finaleTriggered=true;setTimeout(showFinale,520)}}document.querySelector('#x').onclick=closeGift;d.onclick=e=>{let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeGift()};
function makeConfetti(){confetti.innerHTML='';const colors=['#f8df91','#f5f2e8','#b8c9ff','#d7b8ff','#91b8e8'];for(let i=0;i<72;i++){let p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=colors[i%colors.length];p.style.setProperty('--dur',(4+Math.random()*3)+'s');p.style.setProperty('--delay',(Math.random()*1.7)+'s');p.style.setProperty('--drift',(-90+Math.random()*180)+'px');p.style.setProperty('--spin',(-720+Math.random()*1440)+'deg');if(i%3===0){p.style.width='6px';p.style.height='6px';p.style.borderRadius='50%'}confetti.appendChild(p)}}function showFinale(){makeConfetti();finale.classList.remove('show');void finale.offsetWidth;finale.classList.add('show')}document.querySelector('#replay').onclick=showFinale;document.querySelector('#dismiss').onclick=()=>finale.classList.remove('show');
function sync(){music.textContent=bgm.paused?'♪':'Ⅱ'}async function startMusic(fromGate=false){statusEl.textContent=fromGate?'正在点亮北极星…':'';try{bgm.volume=.72;await bgm.play();sync();statusEl.textContent='';if(fromGate){document.body.classList.add('lit');setTimeout(()=>gate.classList.add('hide'),700)}}catch(e){if(fromGate)statusEl.textContent='音乐还没准备好，请再点一次 ✦'}}enter.onclick=()=>startMusic(true);music.onclick=()=>bgm.paused?startMusic(false):(bgm.pause(),sync());bgm.addEventListener('play',sync);bgm.addEventListener('pause',sync);bgm.load();
