*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02040b}body{min-height:100svh;display:grid;place-items:center;overflow:hidden;color:#f7f5ef;font-family:Georgia,"Songti SC",serif;background:radial-gradient(ellipse at 50% 38%,#10162b 0,#060916 42%,#02040b 76%,#010207 100%)}#sky{position:fixed;inset:-4%;width:108%;height:108%;z-index:0;transition:transform .8s ease-out;opacity:.9}.nebula{position:fixed;z-index:0;inset:-18%;pointer-events:none;background:radial-gradient(ellipse at 47% 48%,rgba(72,91,157,.13),transparent 26%),radial-gradient(ellipse at 31% 56%,rgba(95,68,130,.09),transparent 23%),radial-gradient(ellipse at 68% 38%,rgba(55,83,142,.08),transparent 21%);filter:blur(38px);animation:drift 24s ease-in-out infinite alternate}.vignette{position:fixed;z-index:1;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 55px rgba(0,0,0,.68);background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.46) 100%)}.grain{position:fixed;z-index:2;inset:-50%;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.9'/%3E%3C/svg%3E");animation:noise .25s steps(2) infinite}.polar{position:fixed;z-index:3;top:13%;left:76%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 5px 2px #fff,0 0 18px 7px #dbe5ff99,0 0 55px 17px #8da5ff38,0 0 120px 34px #6684e214;transition:1.5s}.polar:before,.polar:after{content:"";position:absolute;left:50%;top:50%;background:linear-gradient(90deg,transparent,#fff9,transparent);transform:translate(-50%,-50%);border-radius:50%}.polar:before{width:44px;height:1px}.polar:after{width:1px;height:44px;background:linear-gradient(transparent,#fff9,transparent)}body.lit .polar{animation:starPulse 4.2s ease-in-out ty:0;visibility:hidden}.gatebox{text-align:center}.enter{border:1px solid #f4e4b744;border-radius:999px;padding:16px 28px;background:#ffffff08;color:#fff2cb;font:15px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.16em;box-shadow:0 0 48px #d8c2701c;backdrop-filter:blur(14px);cursor:pointer}.enter .spark{display:inline-block;margin-right:9px}.audio-status{min-height:22px;margin:14px 20px 0;color:#ffffff78;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.gate.awake:before{animation:ignite 1.7s ease-out forwards}.gate.awake .enter{box-shadow:0 0 75px #d9c5783b}

@keyframes drift{to{transform:translate3d(2.5%,-1.5%,0) scale(1.035)}}@keyframes noise{0%{transform:translate(0)}25%{transform:translate(3%,-2%)}50%{transform:translate(-2%,3%)}75%{transform:translate(2%,2%)}100%{transform:translate(-3%,-2%)}}@keyframes starPulse{50%{transform:scale(1.35);opacity:.72}}@keyframes ignite{0%{transform:scale(1)}45%{transform:scale(2.5);box-shadow:0 0 12px 5px #fff,0 0 70px 25px #9db2ff99}100%{transform:scale(1.2);box-shadow:0 0 8px 3px #fff,0 0 40px 15px #9db2ff66}}@keyframes meteor{0%,76%{opacity:0;transform:translate(0,0) rotate(-25deg)}78%{opacity:.8}83%,100%{opacity:0;transform:translate(115vw,48vh) rotate(-25deg)}}@media(prefers-reduced-motion:reduce){.nebula,.grain,.polar,.shoot,.gate:before{animation:none!important}dialog{transition:none}}@media(max-width:600px){.vignette{box-shadow:inset 0 0 100px 20px rgba(0,0,0,.62)}.polar{top:15%;left:80%}dialog{width:min(430px,89vw);border-radius:29px}.card{border-radius:28px;padding:34px 24px 27px}}

const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d');let stars=[];function makeSky(){let d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=w*d;canvas.height=h*d;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);stars=[];let n=Math.round(w*h/4800);for(let i=0;i<n;i++)stars.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()<.08?Math.random()*1.25+.65:Math.random()*.62+.18,a:Math.random()*.62+.18,p:Math.random()*6.28,s:Math.random()*.009+.002});}function draw(t){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){let a=s.a*(.72+.28*Math.sin(t*s.s+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fillStyle=`rgba(${s.r>1?'255,244,215':'220,230,255'},${a})`;ctx.fill();if(s.r>1){ctx.beginPath();ctx.moveTo(s.x-3*s.r,s.y);ctx.lineTo(s.x+3*s.r,s.y);ctx.moveTo(s.x,s.y-3*s.r);ctx.lineTo(s.x,s.y+3*s.r);ctx.strokeStyle=`rgba(255,250,230,${a*.28})`;ctx.lineWidth=.45;ctx.stroke()}}requestAnimationFrame(draw)}makeSky();requestAnimationFrame(draw);addEventListener('resize',makeSky);let px=0,py=0;function parallax(x,y){px=(x/innerWidth-.5)*-8;py=(y/innerHeight-.5)*-6;canvas.style.transform=`translate3d(${px}px,${py}px,0)`}addEventListener('pointermove',e=>parallax(e.clientX,e.clientY),{passive:true});
const gifts=["手办 · maiya","笔 · pen","许愿柳 · one wish willow","除螨喷雾 · pentac","袜子 · socks","榨汁机 · Blender","巧克力 · chocolate","项链 · Silver necklace","小夜灯 · nightlight"],messages=["our 3D trip memory，powered by maiya3d，colored and repaired by LSY","让星星人陪你一起写下开心与幸福🥰","许愿之后折断，寿星梦想成真","赶走臭臭的螨虫也赶走生活中烦烦的苦恼🌟","亲测健身工作日常都适合，千里之行始于足下","果子变成果汁，水果交出甜，我交出我的心","今年的日子像雪吻巧克力丝滑顺利","前途像钻石一样闪耀🪩","北极星照亮我，小夜灯照亮北极星✨"];const d=document.querySelector('#d'),g=document.querySelector('#g'),h=document.querySelector('#h'),bgm=document.querySelector('#bgm'),music=document.querySelector('#music'),gate=document.querySelector('#gate'),enter=document.querySelector('#enter'),statusEl=document.querySelector('#audioStatus');document.querySelectorAll('.initial').forEach(b=>b.onclick=()=>{let i=+b.dataset.gift;g.textContent=gifts[i];h.textContent=messages[i];d.showModal()});document.querySelector('#x').onclick=()=>d.close();d.onclick=e=>{let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()};function sync(){music.textContent=bgm.paused?'♪':'Ⅱ';music.classList.toggle('playing',!bgm.paused)}async function startMusic(fromGate=false){statusEl.textContent=fromGate?'正在点亮北极星…':'';try{bgm.volume=.72;const p=bgm.play();if(p)await p;sync();statusEl.textContent='';if(fromGate){gate.classList.add('awake');document.body.classList.add('lit');setTimeout(()=>gate.classList.add('hide'),850)}return true}catch(err){sync();if(fromGate){statusEl.textContent='音乐还没准备好，请再点一次 ✦';enter.innerHTML='<span class="spark">✦</span>再次点亮北极星'}return false}}enter.addEventListener('click',()=>startMusic(true));music.addEventListener('click',async()=>{if(bgm.paused)await startMusic(false);else bgm.pause();sync()});bgm.addEventListener('canplay',()=>{if(!gate.classList.contains('hide'))statusEl.textContent='北极星已经准备好 ✦'},{once:true});bgm.addEventListener('error',()=>statusEl.textContent='音乐加载失败，请刷新页面后重试');bgm.addEventListener('play',sync);bgm.addEventListener('pause',sync);bgm.load();
</script></body></html>
